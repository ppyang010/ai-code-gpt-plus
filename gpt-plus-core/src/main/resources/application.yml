spring:
  application:
    name: gpt-plus-core
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mysql?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.example.aichat: info

ai:
  deepseek:
    enabled: true
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    default-model: ${DEEPSEEK_DEFAULT_MODEL:deepseek-v4-flash}
  openai-compatible:
    enabled: ${OPENAI_COMPATIBLE_ENABLED:true}
    providers:
      openai:
        enabled: ${OPENAI_COMPATIBLE_OPENAI_ENABLED:false}
        base-url: ${OPENAI_COMPATIBLE_OPENAI_BASE_URL:https://api.openai.com/v1}
        api-key: ${OPENAI_COMPATIBLE_OPENAI_API_KEY:}
      openrouter:
        enabled: ${OPENAI_COMPATIBLE_OPENROUTER_ENABLED:false}
        base-url: ${OPENAI_COMPATIBLE_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
        api-key: ${OPENAI_COMPATIBLE_OPENROUTER_API_KEY:}

app:
  file:
    upload-root: ${FILE_UPLOAD_ROOT:${user.dir}/.local-storage/files}
    public-base-path: ${FILE_PUBLIC_BASE_PATH:/api/file/content}
    max-image-size-bytes: ${FILE_MAX_IMAGE_SIZE_BYTES:5242880}
  web-search:
    enabled: ${WEB_SEARCH_ENABLED:false}
    provider: ${WEB_SEARCH_PROVIDER:tavily}
    base-url: ${WEB_SEARCH_BASE_URL:https://api.tavily.com}
    api-key: ${WEB_SEARCH_API_KEY:}
    max-results: ${WEB_SEARCH_MAX_RESULTS:5}
    timeout-seconds: ${WEB_SEARCH_TIMEOUT_SECONDS:10}
    search-depth: ${WEB_SEARCH_DEPTH:basic}
