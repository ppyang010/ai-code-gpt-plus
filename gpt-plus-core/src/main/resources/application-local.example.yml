ai:
  deepseek:
    base-url: https://api.deepseek.com
    api-key: your_api_key
    default-model: deepseek-v4-flash
  openai-compatible:
    providers:
      openai:
        enabled: false
        base-url: https://api.openai.com/v1
        api-key: your_openai_api_key
      openrouter:
        enabled: false
        base-url: https://openrouter.ai/api/v1
        api-key: your_openrouter_api_key

app:
  admin-auth:
    token-secret: your_admin_auth_token_secret
    token-issuer: gpt-plus-admin
    token-expire-seconds: 604800
  admin-security:
    encryption-secret: your_admin_security_encryption_secret
  file:
    storage-type: local
    upload-root: ${user.dir}/.local-storage/files
    public-base-path: /api/file/content
    max-image-size-bytes: 5242880
    oss:
      region: oss-cn-hangzhou
      endpoint: https://oss-cn-hangzhou.aliyuncs.com
      bucket: your_bucket_name
      object-prefix: gpt-plus
      object-acl: private
      signed-url-expire-seconds: 1800
      public-base-url: https://your_bucket_name.oss-cn-hangzhou.aliyuncs.com
      access-key-id: your_access_key_id
      access-key-secret: your_access_key_secret
  web-search:
    enabled: false
    provider: tavily
    base-url: https://api.tavily.com
    api-key: your_tavily_api_key
    max-results: 5
    timeout-seconds: 10
    search-depth: basic
